<!doctype html>
<html><head><meta charset="utf-8"><title>The Dayspring v3</title>
<style>
@font-face{font-family:'Dela';src:url(work/fonts/DelaGothicOne-Regular.ttf)}
@font-face{font-family:'Pinyon';src:url(work/fonts/PinyonScript-Regular.ttf)}
@font-face{font-family:'Anton';src:url(work/fonts/Anton-Regular.ttf)}
@font-face{font-family:'Inter';font-weight:100 900;src:url('work/fonts/Inter[opsz,wght].ttf')}
/* Motion colour combos (docs/color-combos.md): Crimson Night = hook + pain, Espresso Gold = turn, proof, future pace, CTA */
:root{--cn-base:#0E0606;--cn-em:#E10304;--cn-sec:#F5E4D0;--cn-tint:#1E0100;--eg-base:#1A0F0A;--eg-em:#FFBF0B;--eg-sec:#FFE6CC;--eg-tint:#4F2B1F}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:var(--cn-base)}
.L{position:absolute;inset:0;transform-origin:50% 50%}
.L>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.L>canvas{position:absolute;inset:0}
.T{position:absolute;white-space:nowrap;color:#fff}
.T .w{display:inline-block;will-change:transform,opacity,filter}
.cap{font-family:'Dela',sans-serif;text-transform:uppercase;letter-spacing:.005em;line-height:1.07}
.scr{font-family:'Pinyon',cursive;line-height:1;letter-spacing:0;text-transform:none}
.body{font-family:'Inter',sans-serif;font-variation-settings:'opsz' 32;font-weight:400;letter-spacing:-.006em;line-height:1.32;color:rgba(255,255,255,.92);white-space:normal}
.anton{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:.96}
.lab{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.red{color:var(--cn-em)}.gold{color:var(--eg-em)}.cream{color:var(--eg-sec)}.rose{color:var(--cn-sec)}
.glow-red{text-shadow:0 0 38px rgba(225,3,4,.45),0 0 90px rgba(225,3,4,.25)}
.glow-gold{text-shadow:0 0 40px rgba(255,191,11,.40),0 0 110px rgba(255,191,11,.22)}
.soft-shadow{text-shadow:0 2px 22px rgba(0,0,0,.55)}
.bubble{position:absolute;padding:.7em 1em;border-radius:1.1em;background:#2a2a2e;color:#fff;font-family:'Inter';font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:.55em;padding:.55em 1.1em;margin:.3em .4em;border-radius:999px;background:rgba(255,191,11,.12);border:1px solid rgba(255,191,11,.55);color:#fff;font-family:'Inter';font-weight:500}
.chip b{display:inline-grid;place-items:center;width:1.2em;height:1.2em;border-radius:50%;background:var(--eg-em);color:#1A0F0A;font-size:.8em}
.win{position:absolute;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 50px 120px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,191,11,.35)}
.win .bar{height:44px;background:#efedea;display:flex;align-items:center;gap:10px;padding:0 18px;font:500 16px 'Inter';color:#8a8580}
.win .bar i{width:13px;height:13px;border-radius:50%;background:#d8d4cf;display:inline-block}
.win .bar span{margin:0 auto;transform:translateX(-30px)}
.win img{display:block;width:100%}
.pill{display:inline-block;padding:.85em 2.1em;border-radius:999px;background:var(--eg-em);color:#1A0F0A;font-family:'Inter';font-weight:700;letter-spacing:.14em}
</style></head>
<body><div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search);
const O = Q.get('o') === 'h' ? 'h' : 'v';
const W = O === 'v' ? 1080 : 1920, H = O === 'v' ? 1920 : 1080;
const IMG = '../../../site/assets/img/';
const stage = document.getElementById('stage'); stage.style.width = W + 'px'; stage.style.height = H + 'px';
const TL = (() => { const x = new XMLHttpRequest(); x.open('GET', 'work/timeline.json', false); x.send(); return JSON.parse(x.responseText); })();
const DUR = TL.dur, F1 = 1 / 60;
const Wd = (b, i) => TL.lines[b].on[i < 0 ? TL.lines[b].on.length + i : i];
const S0 = (b) => TL.lines[b].on[0];
const E = (b) => TL.lines[b].e;
const NW = (b) => TL.lines[b].words.length;

// ---------- easing ----------
const cl = (x) => Math.max(0, Math.min(1, x));
const eOutQuint = (x) => 1 - Math.pow(1 - x, 5), eOutExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eOutCubic = (x) => 1 - Math.pow(1 - x, 3), eInCubic = (x) => x * x * x, eInOutSine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
const V = (v, h) => ({ v, h }); const P = (o) => (o && (o.v !== undefined || o.h !== undefined) ? o[O] : o);
const seeded = (s) => () => ((s = (s * 16807) % 2147483647) / 2147483647);

// ---------- core ----------
const items = [], cues = [], waits = []; let z = 0;
function el(tag, cls, html, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; e.style.zIndex = ++z; (parent || stage).appendChild(e); return e; }
const envelope = (t, t0, t1, fin, fout) => Math.min(fin <= 0.011 ? 1 : eInOutSine(cl((t - t0) / fin)), eInOutSine(cl((t1 - t) / fout)));
const cue = (t, role, extra = {}) => cues.push({ t, role, ...extra });

// Layer: photo / block / canvas. Every change of plate rides a blur (transitions are blur dissolves).
function L(o) {
  const e = el('div', 'L');
  if (o.src) { const i = document.createElement('img'); i.src = IMG + o.src; i.style.objectPosition = P(o.pos) || '50% 50%'; if (o.filter) i.style.filter = o.filter; e.appendChild(i); waits.push(i.decode().catch(() => {})); }
  if (o.html) e.insertAdjacentHTML('beforeend', o.html);
  if (o.style) Object.assign(e.style, P(o.style));
  let cv = null; if (o.draw) { cv = document.createElement('canvas'); cv.width = W; cv.height = H; e.appendChild(cv); }
  const it = { kind: 'layer', e, cv, ctx: cv && cv.getContext('2d'), fin: 0.5, fout: 0.5, blur: 14, kb: [1.04, 1.1, 0, 0, 0, 0], ...o };
  items.push(it);
  if (o.whoosh !== false && o.t0 > 0.1) cue(o.t0 + it.fin * 0.5, 'whoosh', { gain: o.wgain ?? 1 });
  return it;
}
// Text unit. fx = measured presets (text-animation-library.md): up = Words Up (200 ms settle, 6 px blur),
// blur = hero blur-settle (ghosted 110% -> 100%), stamp = word stamp (no blur, lands hard), script = hand-drawn wipe + settle.
const FX = { up: { din: 0.24, rise: 0.25, blur: 6, scale: 0 }, blur: { din: 0.42, rise: 0.06, blur: 16, scale: 0.1 }, stamp: { din: 0.13, rise: 0, blur: 0, scale: 0.28 }, script: { din: 0.7, rise: 0.08, blur: 7, scale: 0.04 } };
function T(o) {
  const pos = P(o.pos), e = el('div', 'T ' + (o.cls || ''));
  e.style.fontSize = pos.fs + 'px'; if (pos.lh) e.style.lineHeight = pos.lh;
  const a = pos.a || 'l'; e.style.textAlign = { l: 'left', c: 'center', r: 'right' }[a];
  if (a === 'c') { e.style.left = (pos.x ?? 0) + 'px'; e.style.width = (pos.w ?? W - 2 * (pos.x ?? 0)) + 'px'; e.style.transformOrigin = '50% 50%'; }
  else if (a === 'l') { e.style.left = pos.x + 'px'; if (pos.w) e.style.width = pos.w + 'px'; e.style.transformOrigin = '0% 60%'; }
  else { e.style.right = pos.x + 'px'; if (pos.w) e.style.width = pos.w + 'px'; e.style.transformOrigin = '100% 60%'; }
  if (pos.y != null) e.style.top = pos.y + 'px'; else e.style.bottom = pos.b + 'px';
  if (o.split === false) e.innerHTML = `<span class="w">${o.html}</span>`;
  else e.innerHTML = o.html.split(/(<br>)/).map((c) => (c === '<br>' ? '<br>' : c.split(' ').filter(Boolean).map((w) => `<span class="w">${w}</span>`).join(' '))).join('');
  if (o.style) e.style.cssText += o.style;
  const units = [...e.querySelectorAll('.w')];
  const fx = { ...FX[o.fx || 'up'], ...(o.fxo || {}) };
  const it = { kind: 'text', e, units, dout: 0.28, drift: 0.03, fs: pos.fs, ...o, F: fx };
  if (o.b) {
    it.ons = o.wi.map((i) => Wd(o.b, i) - F1);
    it.word_idx = o.wi.map((i) => TL.lines[o.b].word_idx[i < 0 ? NW(o.b) + i : i]);
    if (it.ons.length !== units.length) throw new Error(`word links ${it.ons.length} != units ${units.length}: ${o.html}`);
    if (o.t0 == null) it.t0 = it.ons[0];
  } else it.ons = units.map((_, i) => it.t0 + i * (o.stagger ?? 0.06));
  items.push(it);
  // signature sound on the visual peak of hero / script / stamp / number units; body text riding the voice stays silent
  if (o.sfx) units.forEach((u, i) => { const pk = it.ons[i] + (o.fx === 'stamp' ? 0.02 : 0.37 * fx.din); cue(pk, (o.sfxLast && i === units.length - 1) ? o.sfxLast : o.sfx, { i, n: units.length, word: u.textContent }); });
  return it;
}
// Script emphasis word that interlocks with the caps line (carousel-system.md §2): ~3.3x the caps.
// Pinyon is the OFL twin of Tempting, set ~3.9x the caps (carousel-system.md §2): scale the 3.3x layout values by 1.18
const SCR = (o) => T({ fx: 'script', split: false, sfx: 'script', drift: 0.04, ...o, pos: (() => { const p = { ...P(o.pos) }; p.fs *= 1.18; return p; })(), cls: 'scr ' + (o.cls || '') });
function FXL(o) { const it = { kind: 'fx', ...o }; items.push(it); return it; }   // custom per-frame effect

const M = O === 'v' ? 84 : 150;   // side margin (safe zone)

// =====================================================================================================
// ACT 1, CRIMSON NIGHT: the weight
// =====================================================================================================
const b01 = S0('b01');
// embers rising through the whole first act
function embers(n, seed, color) {
  const r = seeded(seed), ps = [...Array(n)].map(() => ({ x: r() * W, y: r() * H, s: 1 + r() * 3.2, v: 18 + r() * 45, ph: r() * 6.28, a: 0.25 + r() * 0.6 }));
  return (ctx, t) => { ctx.clearRect(0, 0, W, H); for (const p of ps) { const y = ((p.y - t * p.v) % H + H) % H, x = p.x + Math.sin(t * 0.6 + p.ph) * 24; const g = ctx.createRadialGradient(x, y, 0, x, y, p.s * 6); g.addColorStop(0, color.replace('A', p.a.toFixed(2))); g.addColorStop(1, color.replace('A', '0')); ctx.fillStyle = g; ctx.fillRect(x - p.s * 6, y - p.s * 6, p.s * 12, p.s * 12); } };
}
L({ t0: -1, t1: b01 + 0.35, fin: 0.01, fout: 0.6, src: 'slots/band-crossover-2400.webp', pos: V('50% 50%', '50% 45%'), filter: 'brightness(.55) saturate(.8) contrast(1.08)', kb: [1.16, 1.26, 0, -18, 0, 0], whoosh: false });
L({ t0: -1, t1: b01 + 0.35, fin: 0.01, fout: 0.6, blur: 0, html: '', style: { background: 'linear-gradient(180deg,rgba(14,6,6,.55),rgba(30,1,0,.35) 45%,rgba(14,6,6,.88))', mixBlendMode: 'normal' }, kb: [1, 1, 0, 0, 0, 0], whoosh: false });
L({ t0: -1, t1: S0('b07') - 0.1, fin: 0.01, fout: 0.4, blur: 0, draw: embers(70, 11, 'rgba(255,90,40,A)'), kb: [1, 1, 0, 0, 0, 0], whoosh: false });

/* b00 hook: "You've been carrying it alone... for a long time." The caps sink under their own weight. */
const capV = O === 'v' ? 92 : 104;
const hk1 = T({ b: 'b00', wi: [0, 1], t1: b01 - 0.02, html: "YOU'VE BEEN", cls: 'cap soft-shadow', fx: 'blur', pos: V({ x: M, y: 560, fs: capV }, { x: M, y: 250, fs: capV }), sfx: 'hero' });
const hk2 = T({ b: 'b00', wi: [2, 3], t1: b01 - 0.02, html: 'CARRYING IT', cls: 'cap soft-shadow', fx: 'blur', pos: V({ x: M, y: 560 + capV * 1.07, fs: capV }, { x: M, y: 250 + capV * 1.07, fs: capV }), sfx: 'hero' });
SCR({ b: 'b00', wi: [4], t1: b01 - 0.02, html: 'alone.', cls: 'red glow-red', pos: V({ x: M + 120, y: 560 + capV * 1.6, fs: capV * 3.3 }, { x: M + 200, y: 250 + capV * 1.55, fs: capV * 3.1 }) });
T({ b: 'b00', wi: [5, 6, 7, 8], t1: b01 - 0.02, html: 'for a long time.', cls: 'body rose', pos: V({ x: M, y: 1330, fs: 46 }, { x: M, y: 820, fs: 44 }) });
FXL({ render: (t) => { const k = eInOutSine(cl((t - Wd('b00', 2)) / 2.6)) * (O === 'v' ? 34 : 22); [hk1, hk2].forEach((h) => (h.sink = k)); } });

/* b01 the late nights: a giant 2:47 clock breathing in the dark */
const night = (b, html, pos, extra = {}) => T({ b, html, pos, cls: 'cap soft-shadow', fx: 'blur', sfx: 'hero', ...extra });
const clockHost = L({ t0: b01 - 0.3, t1: S0('b02') + 0.2, fin: 0.4, fout: 0.35, blur: 10, html: `<div style="position:absolute;inset:0;display:grid;place-items:center"><div class="clk" style="font-family:Inter;font-weight:100;font-size:${O === 'v' ? 400 : 420}px;letter-spacing:-.04em;color:rgba(245,228,208,.13);font-feature-settings:'tnum'">2<span class="col">:</span>47</div></div>`, kb: [1.0, 1.06, 0, 0, 0, 0] });
FXL({ render: (t) => { const c = clockHost.e.querySelector('.col'); if (c) c.style.opacity = (Math.floor(t * 2) % 2 ? 0.25 : 1); } });
for (let k = 0; k < 4; k++) cue(b01 + 0.15 + k * 0.5, 'clock');
night('b01', 'THE LATE', V({ x: M, y: 640, fs: capV }, { x: M, y: 300, fs: capV }), { wi: [0, 1], t1: S0('b02') - 0.02 });
SCR({ b: 'b01', wi: [2], t1: S0('b02') - 0.02, html: 'nights.', cls: 'red glow-red', pos: V({ x: M + 60, y: 640 + capV * 0.5, fs: capV * 3.3 }, { x: M + 120, y: 300 + capV * 0.45, fs: capV * 3.1 }) });

/* b02 the habit you hide: a dark panel slides over the words, the script surfaces from behind it */
const b02t1 = S0('b03') - 0.02;
night('b02', 'THE HABIT<br>YOU', V({ x: M, y: 620, fs: capV }, { x: M, y: 280, fs: capV }), { wi: [0, 1, 2], t1: b02t1 });
const panel = L({ t0: Wd('b02', 2) + 0.05, t1: b02t1 + 0.25, fin: 0.01, fout: 0.25, blur: 0, html: '', style: V({ background: 'linear-gradient(90deg,rgba(14,6,6,0),#0E0606 18%)', left: '0px', top: '600px', height: '260px', inset: 'auto', width: W + 'px' }, { background: 'linear-gradient(90deg,rgba(14,6,6,0),#0E0606 18%)', left: '0px', top: '260px', height: '260px', inset: 'auto', width: W + 'px' }), kb: [1, 1, 0, 0, 0, 0], whoosh: false });
panel.slide = true; cue(Wd('b02', 2) + 0.12, 'swipe');
SCR({ b: 'b02', wi: [3], t1: b02t1, html: 'hide.', cls: 'red glow-red', pos: V({ x: M + 280, y: 620 + capV * 1.2, fs: capV * 3.4 }, { x: M + 420, y: 280 + capV * 1.1, fs: capV * 3.1 }) });

/* b03 the words you can't take back: a sent message the cursor can't delete */
const b03t1 = S0('b04') - 0.02;
const bub = el('div', 'bubble', '<span class="txt"></span><span class="car">|</span>'); Object.assign(bub.style, O === 'v' ? { left: M + 'px', top: '470px', fontSize: '44px' } : { left: M + 'px', top: '170px', fontSize: '40px' });
const MSG = "You never cared anyway.";
FXL({ render: (t) => {
  const a = Wd('b03', 0) - 0.25, vis = t > a && t < b03t1; bub.style.display = vis ? 'block' : 'none'; if (!vis) return;
  const n = Math.min(MSG.length, Math.floor((t - a) / 0.045)); let txt = MSG.slice(0, n);
  const tryDel = Wd('b03', 3);      // "can't": the cursor tries, the words won't go
  if (t > tryDel) { const j = Math.floor((t - tryDel) * 14); txt = MSG; bub.style.transform = `translateX(${(j % 2 ? 1 : -1) * 6 * Math.max(0, 1 - (t - tryDel) / 0.9)}px)`; bub.style.background = j % 3 === 0 && t - tryDel < 0.9 ? '#4a0d0d' : '#2a2a2e'; }
  bub.querySelector('.txt').textContent = txt; bub.querySelector('.car').style.opacity = Math.floor(t * 2.4) % 2 ? 0 : 1;
  bub.style.opacity = Math.min(cl((t - a) / 0.2), cl((b03t1 - t) / 0.25));
} });
for (let i = 0; i < MSG.length; i += 2) cue(Wd('b03', 0) - 0.25 + i * 0.045, 'key', { i });
cue(Wd('b03', 3) + 0.02, 'glitch');
night('b03', "THE WORDS<br>YOU CAN'T<br>TAKE", V({ x: M, y: 720, fs: capV }, { x: M, y: 330, fs: capV * 0.92 }), { wi: [0, 1, 2, 3, 4], t1: b03t1 });
SCR({ b: 'b03', wi: [5], t1: b03t1, html: 'back.', cls: 'red glow-red', pos: V({ x: M + 330, y: 720 + capV * 2.15, fs: capV * 3.4 }, { x: M + 440, y: 330 + capV * 1.9, fs: capV * 3.0 }) });

/* b04 bitterness you keep calling fine: FINE cracks in two */
const b04t1 = S0('b05') - 0.02;
night('b04', 'THE BITTERNESS<br>YOU KEEP CALLING', V({ x: M, y: 520, fs: capV * 0.72 }, { x: M, y: 210, fs: capV * 0.8 }), { wi: [0, 1, 2, 3, 4], t1: b04t1 });
const fineT = Wd('b04', 5);
const fine = el('div', 'T anton', `<div class="fA" style="clip-path:polygon(0 0,52% 0,46% 38%,55% 61%,44% 100%,0 100%)">FINE.</div><div class="fB" style="position:absolute;inset:0;clip-path:polygon(52% 0,100% 0,100% 100%,44% 100%,55% 61%,46% 38%)">FINE.</div><svg class="ck" viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible"><polyline points="52,0 46,38 55,61 44,100" fill="none" stroke="#E10304" stroke-width=".9" vector-effect="non-scaling-stroke" style="stroke-width:5px"/></svg>`);
Object.assign(fine.style, O === 'v' ? { left: M + 'px', top: '760px', fontSize: '470px', color: '#fff' } : { left: M + 'px', top: '420px', fontSize: '420px', color: '#fff' });
FXL({ render: (t) => {
  const vis = t > fineT - F1 && t < b04t1; fine.style.display = vis ? 'block' : 'none'; if (!vis) return;
  const k = eOutExpo(cl((t - fineT + F1) / 0.13)); fine.style.opacity = Math.min(k, cl((b04t1 - t) / 0.25)); fine.style.transform = `scale(${1.3 - 0.3 * k})`;
  const c = cl((t - fineT - 0.55) / 0.4), ce = eOutCubic(c);
  fine.querySelector('.ck').style.opacity = c > 0 ? 1 : 0; fine.querySelector('.ck polyline').style.strokeDasharray = '200'; fine.querySelector('.ck polyline').style.strokeDashoffset = 200 * (1 - cl(c * 3));
  fine.querySelector('.fA').style.transform = `translate(${-26 * ce}px,${18 * ce}px) rotate(${-2.5 * ce}deg)`; fine.querySelector('.fB').style.transform = `translate(${26 * ce}px,${-8 * ce}px) rotate(${2 * ce}deg)`;
  fine.querySelector('.fB').style.color = c > 0 ? `rgb(255,${255 - 200 * ce},${255 - 230 * ce})` : '#fff';
} });
cue(fineT + 0.02, 'stamp'); cue(fineT + 0.6, 'crack');

/* b05 that empty feeling after the party ends: party lights die and fall */
const b05t1 = S0('b06') - 0.02;
L({ t0: S0('b05') - 0.3, t1: b05t1 + 0.3, fin: 0.3, fout: 0.4, blur: 0, kb: [1, 1, 0, 0, 0, 0], whoosh: false, draw: (() => {
  const r = seeded(41), cols = ['255,80,160', '80,180,255', '255,200,60', '160,90,255', '255,110,60'];
  const ps = [...Array(46)].map(() => ({ x: r() * W, y: r() * H * 0.8, s: 30 + r() * 110, c: cols[Math.floor(r() * 5)], v: 30 + r() * 80, d: r() * 0.8 }));
  return (ctx, t) => { ctx.clearRect(0, 0, W, H); const k = cl((t - S0('b05')) / Math.max(0.5, E('b05') - S0('b05'))); for (const p of ps) { const fall = eInCubic(cl(k * 1.3 - p.d * 0.3)); const y = p.y + fall * p.v * 6, a = 0.32 * (1 - eOutCubic(cl(k * 1.15 - p.d * 0.2))); if (a <= 0.01) continue; const g = ctx.createRadialGradient(p.x, y, 0, p.x, y, p.s); g.addColorStop(0, `rgba(${p.c},${a})`); g.addColorStop(1, `rgba(${p.c},0)`); ctx.fillStyle = g; ctx.fillRect(p.x - p.s, y - p.s, p.s * 2, p.s * 2); } };
})() });
SCR({ b: 'b05', wi: [1], t1: b05t1, html: 'empty', cls: 'red glow-red', pos: V({ x: M, y: 440, fs: capV * 3.4 }, { x: M, y: 120, fs: capV * 3.1 }) });
night('b05', 'AFTER THE<br>PARTY ENDS.', V({ x: M, y: 850, fs: capV }, { x: M, y: 520, fs: capV }), { wi: [3, 4, 5, 6], t1: b05t1 });

/* b06 the quiet ache nothing fixes: a heartbeat that slows and flatlines (and stays flat through the meaning pause) */
const b06 = S0('b06'), flat = E('b06') - 0.2, b07 = S0('b07');
L({ t0: b06 - 0.25, t1: b07 + 0.05, fin: 0.3, fout: 0.05, blur: 0, kb: [1, 1, 0, 0, 0, 0], whoosh: false, draw: (ctx, t) => {
  ctx.clearRect(0, 0, W, H); const y0 = O === 'v' ? 1180 : 760, span = W - 2 * M, px = (t - b06 + 0.25) * 520;
