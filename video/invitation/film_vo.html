<!doctype html>
<html><head><meta charset="utf-8"><title>The Dayspring</title>
<style>
@font-face{font-family:'Open Sans';font-weight:300 800;src:url(work/fonts/OpenSans-300.woff2) format('woff2');}
@font-face{font-family:'Lora';font-weight:400 700;src:url(work/fonts/Lora-400.woff2) format('woff2');}
:root{--paper:#f7f6f4;--ink:#2e2e33;--ink-soft:#5c5b62;--taupe:#8a7965;--taupe-deep:#6e5f4e;--taupe-l:#cdbda6;--night:#1d1b1a}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#0b0a09}
.L{position:absolute;inset:0;will-change:transform,opacity,filter;transform-origin:50% 50%}
.L>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.T{position:absolute;color:#fff;font-family:'Open Sans',sans-serif;font-weight:300;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;white-space:nowrap}
.T.serif{font-family:'Lora',serif;font-weight:400;text-transform:none;letter-spacing:0;line-height:1.42;white-space:normal}
.T.lab{font-weight:400;letter-spacing:.2em;line-height:1.3}
.T .w{display:inline-block;will-change:transform,opacity,filter}
.T.ink{color:var(--ink)}.T.taupe{color:var(--taupe)}.T.soft{color:var(--taupe-l)}.T.deep{color:var(--taupe-deep)}.T.inks{color:var(--ink-soft)}
.pill{display:inline-block;padding:.95em 2.1em;border-radius:999px;background:var(--taupe);color:#fff;font-weight:400;letter-spacing:.14em}
.phone{position:absolute;border-radius:54px;background:#111;box-shadow:0 40px 80px -30px rgba(40,30,20,.45),0 0 0 1px rgba(0,0,0,.25)}
.phone .scr{position:absolute;overflow:hidden;border-radius:44px;background:#000}
.phone .scr img{width:100%;height:100%;display:block}
.win{position:absolute;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 40px 90px -30px rgba(40,30,20,.45),0 0 0 1px rgba(0,0,0,.08)}
.win .bar{height:34px;background:#efedea;display:flex;align-items:center;gap:8px;padding:0 14px;font:400 12px 'Open Sans';color:#8a8580;letter-spacing:.04em}
.win .bar i{width:11px;height:11px;border-radius:50%;background:#d8d4cf;display:inline-block}
.win .bar span{margin-left:auto;margin-right:auto;transform:translateX(-30px)}
.win img{display:block;width:100%}
.rule{position:absolute;height:1px;background:var(--taupe);transform-origin:50% 50%}
</style></head>
<body><div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search);
const O = Q.get('o') === 'h' ? 'h' : 'v';
const W = O === 'v' ? 720 : 1280, H = O === 'v' ? 1280 : 720;
// Voice-driven timeline (Orpheus VO): every scene and word is keyed to the spoken word's frame.
const TL = (() => { const x = new XMLHttpRequest(); x.open('GET', 'vo/timeline.json', false); x.send(); return JSON.parse(x.responseText); })();
const DUR = TL.dur;
const Wd = (id, i) => TL.lines[id].on[i];           // refined onset (s, on the 60 fps grid)
const S0 = (id) => TL.lines[id].on[0];
const E = (id) => TL.lines[id].e;
const F1 = 1 / 60;
const IMG = '../../site/assets/img/';
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

// ---------- easing ----------
const cl = (x) => Math.max(0, Math.min(1, x));
const eOutQuint = (x) => 1 - Math.pow(1 - x, 5);
const eInCubic = (x) => x * x * x;
const eInOutSine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
const eOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, k) => a + (b - a) * k;
const P = (o) => (o && (o.v || o.h) ? o[O] : o); // per-orientation value

// ---------- items ----------
const items = [], cues = [], waits = [];
let z = 0;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; e.style.zIndex = ++z; stage.appendChild(e); return e; }

// Layer: full-frame image or block. Fades ride a blur (every design change happens inside a blur).
function layer(o) {
  const e = el('div', 'L ' + (o.cls || ''));
  if (o.src) { const i = document.createElement('img'); i.src = IMG + o.src; if (o.pos) i.style.objectPosition = P(o.pos); e.appendChild(i); waits.push(i.decode().catch(() => {})); }
  if (o.html) e.innerHTML += o.html;
  if (o.style) Object.assign(e.style, P(o.style));
  if (o.filter) e.querySelector('img') ? (e.querySelector('img').style.filter = o.filter) : (e.style.filter = o.filter);
  items.push({ kind: 'layer', e, fin: 0.6, fout: 0.6, blur: 16, kb: [1.04, 1.1, 0, 0, 0, 0], ...o });
  if (o.whoosh !== false && o.t0 > 0.05) cues.push({ t: o.t0 + (o.fin ?? 0.6) * 0.5, type: 'whoosh', gain: o.wgain ?? 1 });
  return e;
}
// Text unit, optionally split into words with a stagger. Words land on their own onset (blur settle + rise).
function text(o) {
  const pos = P(o.pos);
  const e = el('div', 'T ' + (o.cls || ''));
  e.style.fontSize = pos.fs + 'px';
  if (pos.lh) e.style.lineHeight = pos.lh;
  const a = pos.a || 'l';
  e.style.textAlign = a === 'l' ? 'left' : a === 'c' ? 'center' : 'right';
  if (a === 'c') { e.style.left = (pos.x ?? 0) + 'px'; e.style.width = (pos.w ?? W - 2 * (pos.x ?? 0)) + 'px'; e.style.transformOrigin = '50% 50%'; }
  else if (a === 'l') { e.style.left = pos.x + 'px'; if (pos.w) e.style.width = pos.w + 'px'; e.style.transformOrigin = '0% 50%'; }
  else { e.style.right = pos.x + 'px'; if (pos.w) e.style.width = pos.w + 'px'; e.style.transformOrigin = '100% 50%'; }
  if (pos.y != null) e.style.top = pos.y + 'px'; else e.style.bottom = pos.b + 'px';
  let units;
  if (o.split === false) { e.innerHTML = `<span class="w">${o.html}</span>`; }
  else {
    // split into words, keep <br>
    e.innerHTML = o.html.split(/(<br>)/).map((chunk) => chunk === '<br>' ? '<br>' : chunk.split(' ').filter(Boolean).map((w) => `<span class="w">${w}</span>`).join(' ')).join('');
  }
  if (o.style) e.style.cssText += o.style;
  units = [...e.querySelectorAll('.w')];
  const it = { kind: 'text', e, units, din: 0.75, dout: 0.45, rise: 22, blur: 12, stagger: 0.09, drift: 0.03, ...o };
  if (o.vo) {
    // each displayed unit lands on its spoken word: start one frame early so the word's own frame is the first with ink
    it.ons = o.wi.map((i) => Wd(o.vo, i) - F1);
    it.word_idx = o.wi.map((i) => TL.lines[o.vo].word_idx[i]);
    if (o.t0 == null) it.t0 = it.ons[0];
    if (it.ons.length !== units.length) throw new Error(`word links ${it.ons.length} != units ${units.length}: ${o.html}`);
  }
  items.push(it);
  // sound: one cue per word on its visual peak (onset + 0.37*din), exits silent
  units.forEach((u, i) => {
    const on = it.ons ? it.ons[i] : it.t0 + i * it.stagger;
    if (on >= 0 && it.sfx) cues.push({ t: on + 0.37 * it.din, type: (it.sfxLast && i === units.length - 1) ? it.sfxLast : it.sfx, i, n: units.length, word: u.textContent });
  });
  return e;
}

// ---------- scene builders (times from the voice) ----------
const V = (v, h) => ({ v, h });
const M = O === 'v' ? 56 : 104; // side margin
const R = (a, b) => [...Array(b - a + 1).keys()].map((k) => a + k);

/* S1 Hook: candles in the dark */
const b1 = S0('b1');
layer({ t0: -1, t1: b1 + 0.3, fin: 0.01, fout: 0.55, src: 'slots/band-crossover-2400.webp', pos: V('50% 50%', '50% 45%'), filter: 'brightness(.62) saturate(.95)', kb: [1.14, 1.22, 0, -14, 0, 0], whoosh: false });
layer({ t0: -1, t1: b1 + 0.3, fin: 0.01, fout: 0.55, blur: 0, html: '', style: { background: 'linear-gradient(180deg,rgba(8,7,6,.55) 0%,rgba(8,7,6,.15) 40%,rgba(8,7,6,.7) 100%)' }, kb: [1, 1, 0, 0, 0, 0], whoosh: false });
text({ vo: 'hook', wi: [0, 1], t1: b1 - 0.05, html: "YOU'VE BEEN", pos: V({ x: M, y: 470, fs: 60 }, { x: M, y: 214, fs: 62 }), sfx: 'tick' });
text({ vo: 'hook', wi: [2, 3], t1: b1 - 0.05, html: 'CARRYING IT', pos: V({ x: M, y: 540, fs: 60 }, { x: M, y: 286, fs: 62 }), sfx: 'tick' });
text({ vo: 'hook', wi: [4], t1: b1 - 0.05, html: 'ALONE.', pos: V({ x: M - 4, y: 616, fs: 112 }, { x: M - 5, y: 362, fs: 120 }), din: 1.0, rise: 30, blur: 18, sfx: 'hero' });
text({ vo: 'hook', wi: [5, 6, 7, 8], t1: b1 - 0.05, html: 'for a long time.', cls: 'serif soft', pos: V({ x: M, y: 760, fs: 32 }, { x: M, y: 500, fs: 32 }), din: 0.6, sfx: null });

/* S2 Name it: night, a slow orb of light */
const vS = S0('verse');
layer({ t0: b1 - 0.4, t1: vS + 0.6, fin: 0.7, fout: 0.25, blur: 0, html: '', style: { background: '#0c0b0a' }, kb: [1, 1, 0, 0, 0, 0], whoosh: false });
layer({ t0: b1 - 0.3, t1: vS + 0.6, fin: 1.2, fout: 0.3, blur: 0, html: '', style: { background: 'radial-gradient(closest-side, rgba(150,128,104,.34), rgba(150,128,104,.10) 55%, rgba(0,0,0,0) 100%)', inset: 'auto', width: (O === 'v' ? 900 : 1100) + 'px', height: (O === 'v' ? 900 : 1100) + 'px', left: '0px', top: '0px' }, kb: [1, 1, 0, 0, 0, 0], whoosh: false, orb: true });
const B = [
  ['b1', 'b2', 'THE LATE<br>NIGHTS.', V({ x: M, y: 500, fs: 70 }, { x: M, y: 230, fs: 72 })],
  ['b2', 'b3', 'THE HABIT<br>YOU HIDE.', V({ a: 'c', y: 560, fs: 66 }, { a: 'c', y: 260, fs: 72 })],
  ['b3', 'b4', "THE WORDS<br>YOU CAN'T<br>TAKE BACK.", V({ x: M, y: 450, fs: 70 }, { x: M, y: 186, fs: 70 })],
  ['b4', 'b5', 'THE BITTERNESS<br>YOU CALL FINE.', V({ a: 'r', x: M, y: 560, fs: 54 }, { a: 'r', x: M, y: 280, fs: 64 })],
  ['b5', 'ache', 'THE EMPTY<br>AFTER THE<br>PARTY ENDS.', V({ a: 'c', y: 470, fs: 62 }, { a: 'c', y: 196, fs: 64 })],
];
B.forEach(([id, nx, h, pos]) => text({ vo: id, wi: R(0, TL.lines[id].words.length - 1), t1: S0(nx) - 0.02, html: h, pos, din: 0.55, dout: 0.3, rise: 18, sfx: 'tick', drift: 0.035 }));
text({ vo: 'ache', wi: R(0, 5), t1: E('ache') + 0.7, html: 'And that quiet ache<br>nothing fixes.', cls: 'serif soft', pos: V({ x: M, y: 580, fs: 38 }, { x: M, y: 300, fs: 40 }), din: 0.7, dout: 0.45, sfx: 'pluck' });

/* S3 The turn (after the meaning pause) */
text({ vo: 'turn', wi: [3, 4, 5], t1: vS - 0.15, html: 'YOU ARE NOT', pos: V({ a: 'c', y: 500, fs: 58 }, { a: 'c', y: 226, fs: 66 }), din: 0.9, sfx: 'tick' });
text({ vo: 'turn', wi: [6, 7, 8], t1: vS - 0.15, html: 'TOO FAR GONE.', pos: V({ a: 'c', y: 576, fs: 76 }, { a: 'c', y: 306, fs: 92 }), din: 1.0, rise: 26, blur: 16, sfx: 'tick', sfxLast: 'hero' });
text({ vo: 'turn2', wi: R(0, 5), t1: vS - 0.15, html: 'Not too late. Not too much.', cls: 'serif soft', pos: V({ a: 'c', y: 700, fs: 32 }, { a: 'c', y: 440, fs: 34 }), sfx: 'pluck' });

/* S4 Release: Matthew 11:28 over raised hands */
const dS = S0('dawn');
layer({ t0: vS - 0.45, t1: E('verse') + 0.75, fin: 0.7, fout: 0.45, src: 'slots/detail-hands-1400.webp', pos: V('50% 40%', '50% 32%'), filter: 'brightness(.5) saturate(.85) contrast(1.05)', kb: [1.06, 1.16, 0, 0, 10, -14] });
layer({ t0: vS - 0.45, t1: E('verse') + 0.75, fin: 0.7, fout: 0.45, blur: 0, html: '', style: V({ background: 'linear-gradient(180deg,rgba(8,7,6,.15),rgba(8,7,6,.55) 45%,rgba(8,7,6,.35))' }, { background: 'linear-gradient(90deg,rgba(8,7,6,.75),rgba(8,7,6,.2) 70%)' }), kb: [1, 1, 0, 0, 0, 0], whoosh: false });
text({ vo: 'verse', wi: R(0, 16), t1: E('verse') + 0.6, html: 'Come unto me, all ye that labour and are heavy laden, and I will give you rest.', cls: 'serif', pos: V({ x: M, y: 440, fs: 40, w: 600 }, { x: M, y: 190, fs: 42, w: 720 }), din: 0.7, dout: 0.5, sfx: 'pluck', sfxLast: 'bell', drift: 0.02 });
text({ t0: E('verse') - 0.35, t1: E('verse') + 0.6, html: 'MATTHEW 11:28', cls: 'lab soft', pos: V({ x: M, y: 720, fs: 15 }, { x: M, y: 450, fs: 15 }), split: false, sfx: null });

/* S5 Dawn: the dayspring from on high */
const nS = S0('name');
layer({ t0: dS - 0.7, t1: nS + 0.9, fin: 1.6, fout: 0.8, blur: 0, html: '', style: { background: 'linear-gradient(0deg,#f1c79a 0%,#c98d76 14%,#6c5470 36%,#2a3456 62%,#111a30 85%,#0c1222 100%)', top: '-320px' }, kb: [1.0, 1.0, 0, 0, 260, 0], whoosh: false, rise: true });
layer({ t0: dS - 0.55, t1: nS + 0.9, fin: 2.4, fout: 0.8, blur: 0, html: '', style: { background: 'radial-gradient(60% 34% at 50% 100%, rgba(255,236,206,.95), rgba(255,214,170,.45) 45%, rgba(255,200,150,0) 100%)' }, kb: [1.0, 1.25, 0, 0, 200, 0], whoosh: false });
text({ vo: 'dawn', wi: R(0, 7), t1: nS - 0.1, html: 'The dayspring from on high<br>hath visited us.', cls: 'serif', pos: V({ a: 'c', y: 470, fs: 40 }, { a: 'c', y: 230, fs: 44 }), din: 0.8, sfx: 'pluck', sfxLast: 'bell' });
text({ t0: E('dawn') - 0.2, t1: nS - 0.1, html: 'LUKE 1:78', cls: 'lab', pos: V({ a: 'c', y: 610, fs: 15 }, { a: 'c', y: 372, fs: 15 }), split: false, sfx: null });
const hS = S0('home');
layer({ t0: nS - 0.45, t1: hS + 0.3, fin: 0.7, fout: 0.5, src: 'slots/hero-campus-1920.webp', pos: V('50% 50%', '50% 50%'), filter: 'brightness(.9)', kb: [1.12, 1.04, 0, 0, 0, 0], wgain: 0.7 });
layer({ t0: nS - 0.45, t1: hS + 0.3, fin: 0.7, fout: 0.5, blur: 0, html: '', style: { background: 'linear-gradient(180deg,rgba(10,12,20,.72) 0%,rgba(10,12,20,.15) 38%,rgba(10,12,20,0) 60%,rgba(10,12,20,.35) 100%)' }, kb: [1, 1, 0, 0, 0, 0], whoosh: false });
text({ t0: nS - 0.3, t1: hS + 0.05, html: `<img src="${IMG}rccg-emblem-400.png" style="width:${O === 'v' ? 96 : 84}px;height:auto;display:block;margin:0 auto">`, split: false, pos: V({ a: 'c', y: 170, fs: 10 }, { a: 'c', x: 0, w: 520, y: 92, fs: 10 }), din: 0.9, rise: 10, blur: 10, sfx: 'reveal' });
text({ vo: 'name', wi: [0, 1], t1: hS + 0.05, html: 'DAYSPRING CHAPEL', cls: 'lab', pos: V({ a: 'c', y: 290, fs: 30, lh: 1.2 }, { a: 'c', x: 0, w: 520, y: 190, fs: 28 }), din: 0.8, sfx: null });
text({ vo: 'name', wi: R(2, 10), t1: hS + 0.05, html: 'A parish of The Redeemed Christian Church of God.', cls: 'serif', pos: V({ a: 'c', x: 90, y: 384, fs: 22 }, { a: 'c', x: 60, w: 400, y: 272, fs: 22 }), din: 0.6, sfx: null });
const nw = TL.lines.name.words.length;
text({ vo: 'name', wi: [nw - 1], t1: hS + 0.05, html: 'H O U S T O N', cls: 'lab', split: false, pos: V({ a: 'c', y: 340, fs: 13 }, { a: 'c', x: 0, w: 520, y: 234, fs: 13 }), sfx: null });

/* S6a Proof: the real site, desktop view */
const pS = S0('pastors');
layer({ t0: hS - 0.4, t1: pS + 0.25, fin: 0.55, fout: 0.45, blur: 18, html: '', style: { background: 'var(--paper)' }, kb: [1, 1, 0, 0, 0, 0], wgain: 0.9 });
text({ t0: hS - 0.1, t1: pS + 0.05, html: 'RCCG DAYSPRING CHAPEL', cls: 'lab taupe', pos: V({ a: 'c', y: 250, fs: 13 }, { a: 'c', y: 26, fs: 12 }), split: false, sfx: null });
text({ vo: 'home', wi: [0, 1, 2, 3], t1: pS + 0.05, html: 'A HOME IN HOUSTON.', cls: 'taupe', pos: V({ a: 'c', y: 280, fs: 42 }, { a: 'c', y: 48, fs: 34 }), sfx: 'tick' });
if (O === 'v') text({ vo: 'home', wi: R(4, 13), t1: pS + 0.05, html: 'Service times, directions and a plan<br>for your first Sunday.', cls: 'serif inks', pos: { a: 'c', y: 920, fs: 26 }, din: 0.6, sfx: null });
let device, scr;
device = el('div', 'win');
if (O === 'v') Object.assign(device.style, { left: '24px', top: '420px', width: '672px', height: '454px' });
else Object.assign(device.style, { left: '236px', top: '112px', width: '808px', height: '540px' });
device.innerHTML = `<div class="bar"><i></i><i></i><i></i><span>rccgdayspring.org</span></div><div style="height:${O === 'v' ? 420 : 506}px;overflow:hidden"><img></div>`;
scr = device.querySelector('img');
items.push({ kind: 'device', e: device, t0: hS - 0.2, t1: pS + 0.1, din: 0.95, dout: 0.45 });
cues.push({ t: hS + 0.15, type: 'tick' });
const SITE_DIR = 'work/site-desktop/';
const SITE_N = 324, SITE_T0 = Math.max(hS, pS - SITE_N / 60);

/* S6b Pastors: their title behind them */
const fS = S0('family');
layer({ t0: pS - 0.3, t1: fS + 0.25, fin: 0.5, fout: 0.45, blur: 0, html: '', style: { background: 'radial-gradient(80% 60% at 50% 55%,#4a3d31 0%,#2a221c 55%,#151110 100%)' }, kb: [1, 1, 0, 0, 0, 0], wgain: 0.9 });
text({ vo: 'pastors', wi: [0], t1: fS + 0.05, html: 'PASTORS', split: false, pos: V({ a: 'c', y: 300, fs: 150 }, { a: 'c', y: 40, fs: 210 }), din: 0.9, rise: 30, blur: 16, sfx: 'hero', drift: 0.04, style: 'opacity:.92' });
layer({ t0: pS - 0.1, t1: fS + 0.25, fin: 0.6, fout: 0.45, blur: 10, html: `<img src="${IMG}pastors-cutout-1200.webp" style="object-fit:contain;object-position:50% 100%;${O === 'v' ? 'top:318px;height:980px' : 'top:96px;height:624px'}">`, kb: [1.0, 1.03, 0, 0, 30, 0], whoosh: false, origin: '50% 100%' });
text({ vo: 'pastors', wi: [1], t1: fS + 0.05, html: 'JOEL AND FUNMI UZOMA', cls: 'lab', split: false, pos: V({ a: 'c', y: 196, fs: 15 }, { x: M, y: 470, fs: 14 }), sfx: null });
text({ vo: 'pastors', wi: [5, 6, 7, 8, 9], t1: fS + 0.05, html: 'Together in ministry since 1995.', cls: 'serif', pos: V({ a: 'c', y: 226, fs: 26 }, { x: M, y: 500, fs: 26, w: 260 }), din: 0.6, sfx: null });

/* S6c Congregation */
const fpS = S0('picture');
if (O === 'v') {
  layer({ t0: fS - 0.35, t1: fpS + 0.3, fin: 0.5, fout: 0.45, blur: 0, html: '', style: { background: '#141110' }, kb: [1, 1, 0, 0, 0, 0], whoosh: false });
  layer({ t0: fS - 0.25, t1: fpS + 0.3, fin: 0.6, fout: 0.45, src: 'slots/band-congregation-1280.webp', style: { inset: 'auto', left: '0px', top: '470px', width: '720px', height: '360px', overflow: 'hidden' }, kb: [1.0, 1.06, 0, 0, 0, 0], pos: '50% 0%' });
} else {
  layer({ t0: fS - 0.35, t1: fpS + 0.3, fin: 0.6, fout: 0.45, src: 'slots/band-congregation-2400.webp', pos: '50% 10%', filter: 'brightness(.85)', kb: [1.02, 1.08, 0, 0, 0, 0] });
  layer({ t0: fS - 0.35, t1: fpS + 0.3, fin: 0.6, fout: 0.45, blur: 0, html: '', style: { background: 'linear-gradient(0deg,rgba(8,7,6,.82),rgba(8,7,6,.35) 30%,rgba(8,7,6,0) 55%)' }, kb: [1, 1, 0, 0, 0, 0], whoosh: false });
}
text({ vo: 'family', wi: [0, 1], t1: fpS - 0.05, html: 'EVERY NATION.', pos: V({ a: 'c', y: 360, fs: 56 }, { x: M, b: 112, fs: 60 }), sfx: 'tick' });
text({ vo: 'family', wi: [2, 3], t1: fpS - 0.05, html: 'ONE FAMILY.', cls: 'soft', pos: V({ a: 'c', y: 870, fs: 56 }, { x: M, b: 50, fs: 60 }), sfx: 'tick' });

/* S7 Future pace */
const sgS = S0('song'), stS = S0('sit'), brS = S0('bring'), cS = S0('come');
const FP = [
  [fpS - 0.35, sgS + 0.3, 'slots/ed-ribbon-1400.webp', V('50% 50%', '50% 38%'), [1.04, 1.16, 0, 0, 0, -20]],
  [sgS - 0.35, stS + 0.3, 'worship-2400.webp', V('42% 50%', '50% 38%'), [1.04, 1.1, 0, -12, 0, 0]],
  [stS - 0.35, brS + 0.3, 'slots/ed-sanctuary-1400.webp', V('50% 50%', '50% 50%'), [1.1, 1.04, 0, 0, 0, 0]],
